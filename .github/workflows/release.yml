name: Windows Release

on:
  push:
    branches:
      - codex/windows-release-pr-build
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test Release binaries
        shell: pwsh
        run: |
          $testTemp = Join-Path $PWD 'build_tmp\release-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          .\build.ps1 -Modern -Test -BuildDir build\release

      - name: Prepare standalone executables
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath 'build\release\rshell.exe', 'build\release\rshell-gui.exe' -Destination $dist

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rshell-windows-x64
          path: |
            dist/rshell-gui.exe
            dist/rshell.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rshell-windows-x64
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $checksums = @('dist/rshell-gui.exe', 'dist/rshell.exe') | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_ -Algorithm SHA256).Hash.ToLowerInvariant() )  $([IO.Path]::GetFileName($_))"
          }
          $notes = @('## SHA-256', '', '```text') + $checksums + @('```')
          [IO.File]::WriteAllLines((Join-Path $PWD 'release-notes.md'), $notes, [Text.UTF8Encoding]::new($false))
          $ghReleaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            'dist/rshell-gui.exe', 'dist/rshell.exe',
            '--verify-tag', '--generate-notes', '--notes-file', 'release-notes.md'
          )
          gh @ghReleaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

