name: Windows Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-release:
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and test Release binaries
        shell: pwsh
        run: |
          $testTemp = Join-Path $PWD 'build_tmp\release-tests'
          New-Item -ItemType Directory -Force -Path $testTemp | Out-Null
          $env:TEMP = $testTemp
          $env:TMP = $testTemp
          .\build.ps1 -Modern -Test -BuildDir build\release

      - name: Package binaries and checksums
        shell: pwsh
        run: |
          $dist = Join-Path $PWD 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath 'build\release\rshell.exe', 'build\release\rshell-gui.exe' -Destination $dist
          Compress-Archive -LiteralPath 'build\release\rshell.exe', 'build\release\rshell-gui.exe' `
            -DestinationPath (Join-Path $dist 'rshell-windows-x64.zip') -CompressionLevel Optimal
          $checksums = Get-ChildItem -LiteralPath $dist -File | Sort-Object Name | ForEach-Object {
            "$( (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          [IO.File]::WriteAllLines((Join-Path $dist 'SHA256SUMS.txt'), $checksums, [Text.Encoding]::ASCII)

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: rshell-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-release
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: rshell-windows-x64
          path: dist

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ghReleaseArgs = @(
            'release', 'create', $env:GITHUB_REF_NAME,
            'dist/rshell-windows-x64.zip', 'dist/SHA256SUMS.txt',
            '--verify-tag', '--generate-notes'
          )
          gh @ghReleaseArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

